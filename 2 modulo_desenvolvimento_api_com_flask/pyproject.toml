[project]
name = "dio-bank"
version = "0.1.0"
description = ""
authors = [
    {name = "RyanCarllos01",email = "ryancarllos.jac01@gmail.com"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "flask>=3.1,<4.0",
    "flask-sqlalchemy>=3.1,<4.0",
    "flask-migrate>=4.1,<5.0",
    "flask-jwt-extended",
    "pytest",
    "pytest-mock"
]


[tool.pytest.ini_options]
addopts = ["-ra", "-vv"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
